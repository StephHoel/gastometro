name: Refresh Expo SDK 58 dependency lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/expo-stack-2c1219c12b

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/expo-stack-2c1219c12b
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install current dependencies
        run: npm ci --legacy-peer-deps
      - name: Configure npm peer dependency resolution
        run: npm config set legacy-peer-deps true
      - name: Align packages with Expo SDK
        run: npx expo install --fix
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit dependency alignment
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: align dependencies with Expo SDK 58"
            git push origin HEAD:dependabot/npm_and_yarn/expo-stack-2c1219c12b
          fi
