name: Build APK and Release to GitHub

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  security-events: write
  packages: read

jobs:
  detect-languages:
    name: Detecção das Linguagens
    uses: ./.github/workflows/detect-and-analyze-languages.yml

  verify-version-bump:
    name: Verifica Mudança de Versão
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify changed paths and versions
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh ./scripts/verify-version-bump.sh "$env:BASE_SHA" "$env:HEAD_SHA"

  validate:
    name: Validar Codigo e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --loglevel=error --legacy-peer-deps

      - name: Verificar tipos TypeScript
        run: npm run check:ts

      - name: Executar testes automatizados com cobertura
        run: npm run test:coverage

  expo-doctor:
    name: Validar Expo Doctor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check WCAG AA text contrast
        run: npm run check:a11y:contrast

      - name: Check Expo SDK dependency compatibility
        run: npm run check:deps

      - name: Check Expo project health
        run: npm run check:expo

  web-routing-e2e:
    name: Roteamento web SPA
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run check:ts

      - name: Instalar Chromium e dependências do sistema
        run: npx --yes --package=playwright@1.56.1 playwright install --with-deps chromium

      - name: Executar testes E2E web
        run: npm run test:e2e:web

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-web
          path: artifacts/web-e2e/
          if-no-files-found: ignore

  build:
    name: Build and Release
    needs: [detect-languages, verify-version-bump, validate, expo-doctor, web-routing-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Clean local caches
        run: rm -rf node_modules android .gradle .expo .expo-shared

      - name: Install dependencies
        run: npm install --loglevel=error --legacy-peer-deps

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Apply Android build optimizations
        shell: bash
        run: |
          set -euo pipefail

          set_prop() {
            local key="$1"
            local value="$2"
            local file="$3"

            if grep -q "^${key}=" "$file"; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" "$file"
              rm -f "${file}.bak"
            else
              if [ -s "$file" ] && [ -n "$(tail -c 1 "$file" 2>/dev/null || true)" ]; then
                echo "" >> "$file"
              fi
              echo "${key}=${value}" >> "$file"
            fi
          }

          set_prop "newArchEnabled" "false" "android/gradle.properties"
          set_prop "expo.gif.enabled" "false" "android/gradle.properties"
          set_prop "expo.webp.enabled" "false" "android/gradle.properties"
          set_prop "EX_DEV_CLIENT_NETWORK_INSPECTOR" "false" "android/gradle.properties"
          set_prop "reactNativeArchitectures" "arm64-v8a" "android/gradle.properties"
          set_prop "expo.useLegacyPackaging" "true" "android/gradle.properties"
          set_prop "android.enableBundleCompression" "true" "android/gradle.properties"

          if ! grep -q 'resConfigs "en", "pt-rBR"' android/app/build.gradle; then
            sed -i.bak '/targetSdkVersion rootProject.ext.targetSdkVersion/a\\        resConfigs "en", "pt-rBR"' android/app/build.gradle
            rm -f android/app/build.gradle.bak
          fi

      - name: Build Android release
        working-directory: android
        run: |
          chmod +x gradlew
          export ORG_GRADLE_PROJECT_reactNativeArchitectures="arm64-v8a"
          ./gradlew assembleRelease --console=plain --warning-mode summary

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p _apks

          latest_apk=$(find android/app/build -type f -name "*.apk" \
            ! -name "*unaligned*" \
            ! -name "*debug*" \
            -print 2>/dev/null | while IFS= read -r file; do
              size=$(wc -c < "$file" 2>/dev/null || echo 0)
              echo "$size|$file"
            done | sort -n | head -n 1 | cut -d'|' -f2- || true)

          if [ -z "$latest_apk" ]; then
            echo "APK nao encontrado nos locais esperados"
            exit 1
          fi

          target="_apks/gastometro-$(date +"%Y%m%d%H%M%S").apk"
          mv "$latest_apk" "$target"
          echo "APK coletado: $target"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gastometro
          path: _apks/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Create or Update GitHub Release for Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.ref_name == 'main' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK_PATH=$(ls -1 _apks/*.apk 2>/dev/null | head -n1 || true)

          if [ -z "$APK_PATH" ]; then
            echo "No APK found in _apks/ to upload"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not read version from package.json"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release with tag '$TAG' already exists. Uploading new APK for this version..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Creating new release for version '$VERSION' (tag '$TAG')..."
            gh release create "$TAG" "$APK_PATH" \
              --title "v$VERSION" \
              --target $GITHUB_SHA \
              --generate-notes
          fi

      - name: Create or Update GitHub Release for Other Branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.ref_name != 'main' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-alpha"
          APK_PATH=$(ls -1 _apks/*.apk 2>/dev/null | head -n1 || true)

          if [ -z "$APK_PATH" ]; then
            echo "No APK found in _apks/ to upload"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not read version from package.json"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release with tag '$TAG' already exists. Uploading new APK for this alpha version..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Creating new prerelease for version '$VERSION' (tag '$TAG')..."
            gh release create "$TAG" "$APK_PATH" \
              --title "v${VERSION}-alpha" \
              --target $GITHUB_SHA \
              --generate-notes \
              --prerelease
          fi
